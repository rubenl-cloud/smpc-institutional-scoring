name: Python reference checks
on:
  push:
  pull_request:
jobs:
  plaintext-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic demonstration
        run: python scripts/quick_demo.py --threshold 10
